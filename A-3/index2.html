<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강원천문대</title>
    <link rel="stylesheet" href="css/style2.css" />
    <script src="js/jquery-1.12.3.js"></script>
    <script src="js/script.js"></script>
  </head>
  <body>
    <!-- 큰 레이아웃 -->
    <div class="wrap">
      <!-- 헤더 -->
      <header class="header">
        <!-- 헤더 안 로고 -->
        <div class="logo_header">
          <a href="#">
            <img src="images/images/logo.png" alt="logo" />
          </a>
        </div>
        <!-- 헤더 안 메뉴바 -->
        <nav class="header_nav">
          <ul class="main_ul">
            <li>
              <a href="#">강원천문대 </a>
              <ul class="sub_ul">
                <li><a href="#">천문대소개</a></li>
                <li><a href="#">인사말</a></li>
                <li><a href="#">오시는길</a></li>
              </ul>
            </li>

            <li>
              <a href="#">이용안내 </a>
              <ul class="sub_ul">
                <li><a href="#">프로그램</a></li>
                <li><a href="#">관람시간표</a></li>
                <li><a href="#">이달의 별자리</a></li>
              </ul>
            </li>
            <li>
              <a href="#">천문대예약 </a>
              <ul class="sub_ul">
                <li><a href="#">예약하기</a></li>
                <li><a href="#">예약확인</a></li>
                <li><a href="#">예약취소</a></li>
              </ul>
            </li>
            <li>
              <a href="#">커뮤니티 </a>
              <ul class="sub_ul">
                <li><a href="#">공지사항</a></li>
                <li><a href="#">방문후기</a></li>
                <li><a href="#">자유게시판</a></li>
              </ul>
            </li>
          </ul>
        </nav>
      </header>
      <!-- 컨텐츠 -->
       <div class="contents">
        <!-- 이미지 슬라이드 -->
         <div class="slid">
          <!-- 슬라이드 모음 리스트-->
           <ul class="slid_all">
            <li>
              <a href="#">
                <img src="images/images/img1.jpg" alt="이미지1">
                <span>이미지1</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="images/images/img2.jpg" alt="이미지2">
                <span>이미지2</span>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="images/images/img3.jpg" alt="이미지3">
                <span>이미지3</span>
              </a>
            </li>
           </ul>
         </div>
         <!-- 텍스트 컨텐츠 -->
       </div>
    </div>
  </body>
</html>
